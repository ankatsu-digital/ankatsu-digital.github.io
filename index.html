<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国 津波情報モニタ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    
    .alert-box {
      display: none;
      padding: 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    /* 各警報レベルのスタイル */
    .major-tsunami {
      background-color: #c40000;
      font-size: 24px;
      animation: blink 1s infinite;
    }

    .tsunami {
      background-color: #e60000;
      font-size: 20px;
    }

    .advisory {
      background-color: #f29c00;
      font-size: 18px;
    }

    .normal {
      display: block;
      background-color: #28a745;
      font-size: 16px;
    }

    .area-list {
      margin-top: 10px;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 4px;
      text-align: left;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>全国 津波情報モニタ</h2>
  <button onclick="checkTsunamiInfo()">最新情報を取得</button>

  <div id="status-display" class="alert-box">
    情報を読み込んでいます...
  </div>

  <script>
    // CORS対応済みの「P2P地震情報 API」を利用（プロキシ不要でGitHub Pagesから直接取得可能）
    const P2P_API_URL = "https://api.p2pquake.net/v2/history?codes=552&limit=1";

    async function checkTsunamiInfo() {
      const display = document.getElementById("status-display");
      display.style.display = "block";
      display.className = "alert-box";
      display.innerText = "確認中...";

      try {
        const response = await fetch(P2P_API_URL);
        if (!response.ok) throw new Error("HTTP error " + response.status);

        const data = await response.json();

        // データがない、または解除(cancelled=true)の場合は平常時表示
        if (!data || data.length === 0 || data[0].cancelled) {
          showNormal(display);
          return;
        }

        const latestTsunami = data[0];
        const areas = latestTsunami.areas || [];

        let affectedAreas = {
          major: [],
          tsunami: [],
          advisory: []
        };

        // 各地域の警報グレードを分類
        areas.forEach(area => {
          // grade: MajorWarning (大津波警報), Warning (津波警報), Advisory (津波注意報)
          if (area.grade === "MajorWarning") {
            affectedAreas.major.push(area.name);
          } else if (area.grade === "Warning") {
            affectedAreas.tsunami.push(area.name);
          } else if (area.grade === "Advisory") {
            affectedAreas.advisory.push(area.name);
          }
        });

        // 画面の表示切替
        if (affectedAreas.major.length > 0) {
          display.className = "alert-box major-tsunami";
          display.innerHTML = `
            🚨【大津波警報 発令中】<br>
            沿岸部の方は今すぐ高台や頑丈な建物の上層へ逃げてください！<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.major.join("、")}</div>
          `;
        } else if (affectedAreas.tsunami.length > 0) {
          display.className = "alert-box tsunami";
          display.innerHTML = `
            ⚠️【津波警報 発令中】<br>
            海岸や川の近くにいる方は、今すぐ離れて安全な場所へ逃げてください！<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.tsunami.join("、")}</div>
          `;
        } else if (affectedAreas.advisory.length > 0) {
          display.className = "alert-box advisory";
          display.innerHTML = `
            🟡【津波注意報 発令中】<br>
            海の中にいる方はすぐに海から上がり、海岸から離れてください。<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.advisory.join("、")}</div>
          `;
        } else {
          showNormal(display);
        }

      } catch (error) {
        console.error("データ取得エラー:", error);
        display.style.display = "block";
        display.style.backgroundColor = "#6c757d";
        display.innerText = "情報の取得に失敗しました。テレビ・ラジオ等のニュースをご確認ください。";
      }
    }

    function showNormal(display) {
      display.className = "alert-box normal";
      display.innerHTML = "現在、日本全国に津波注意報・警報・大津波警報は発表されていません。";
    }

    // ページ読み込み時に実行
    checkTsunamiInfo();
  </script>

</body>
</html>
