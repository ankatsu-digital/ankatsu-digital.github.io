<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国 津波情報モニタ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    
    .alert-box {
      display: none;
      padding: 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    .major-tsunami {
      background-color: #c40000;
      font-size: 24px;
      animation: blink 1s infinite;
    }

    .tsunami {
      background-color: #e60000;
      font-size: 20px;
    }

    .advisory {
      background-color: #f29c00;
      font-size: 18px;
    }

    .normal {
      display: block;
      background-color: #28a745;
      font-size: 16px;
    }

    .area-list {
      margin-top: 10px;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 4px;
      text-align: left;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>全国 津波情報モニタ</h2>
  <button onclick="checkTsunamiInfo()">最新情報を取得</button>

  <div id="status-display" class="alert-box">
    情報を読み込んでいます...
  </div>

  <script>
    async function checkTsunamiInfo() {
      const display = document.getElementById("status-display");
      display.style.display = "block";
      display.className = "alert-box";
      display.innerText = "確認中...";

      // 高速・高安定なCORSプロキシを経由して気象庁の最新津波一覧を取得
      const targetUrl = "https://www.jma.go.jp/bosai/tsunami/data/vtse41.json";
      const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("通信エラー");
        
        const listData = await response.json();

        if (!listData || listData.length === 0) {
          showNormal(display);
          return;
        }

        // 最新の津波電報IDを取得
        const latestId = listData[0].id;
        
        // 個別の詳細データを取得
        const detailUrl = `https://www.jma.go.jp/bosai/tsunami/data/${latestId}.json`;
        const detailProxyUrl = "https://corsproxy.io/?" + encodeURIComponent(detailUrl);
        
        const detailRes = await fetch(detailProxyUrl);
        const detailData = await detailRes.json();

        // 発表状況の解析
        let affectedAreas = {
          major: [],
          tsunami: [],
          advisory: []
        };

        const items = detailData?.Body?.Tsunami?.Item;

        if (items) {
          const itemList = Array.isArray(items) ? items : [items];
          for (const item of itemList) {
            const areaName = item.Area?.Name || "";
            const kindName = item.Category?.Kind?.Name || "";

            if (kindName.includes("大津波")) {
              affectedAreas.major.push(areaName);
            } else if (kindName.includes("警報")) {
              affectedAreas.tsunami.push(areaName);
            } else if (kindName.includes("注意報")) {
              affectedAreas.advisory.push(areaName);
            }
          }
        }

        // 画面表示判定
        if (affectedAreas.major.length > 0) {
          display.className = "alert-box major-tsunami";
          display.innerHTML = `
            🚨【大津波警報 発令中】<br>
            沿岸部の方は今すぐ高台や頑丈な建物の上層へ逃げてください！<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.major.join("、")}</div>
          `;
        } else if (affectedAreas.tsunami.length > 0) {
          display.className = "alert-box tsunami";
          display.innerHTML = `
            ⚠️【津波警報 発令中】<br>
            海岸や川の近くにいる方は、今すぐ離れて安全な場所へ逃げてください！<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.tsunami.join("、")}</div>
          `;
        } else if (affectedAreas.advisory.length > 0) {
          display.className = "alert-box advisory";
          display.innerHTML = `
            🟡【津波注意報 発令中】<br>
            海の中にいる方はすぐに海から上がり、海岸から離れてください。<br>
            <div class="area-list"><strong>対象地域:</strong> ${affectedAreas.advisory.join("、")}</div>
          `;
        } else {
          showNormal(display);
        }

      } catch (error) {
        console.error("エラー詳細:", error);
        display.style.display = "block";
        display.style.backgroundColor = "#6c757d";
        display.innerText = "情報の取得に失敗しました。インターネット接続を確認するか、少し時間を置いて再度お試しください。";
      }
    }

    function showNormal(display) {
      display.className = "alert-box normal";
      display.innerHTML = "現在、日本全国に津波注意報・警報・大津波警報は発表されていません。";
    }

    // 初回実行
    checkTsunamiInfo();
  </script>

</body>
</html>
