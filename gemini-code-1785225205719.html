<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国 津波情報モニタ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    
    .alert-box {
      display: none;
      padding: 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    .major-tsunami {
      background-color: #c40000;
      font-size: 24px;
      animation: blink 1s infinite;
    }

    .tsunami {
      background-color: #e60000;
      font-size: 20px;
    }

    .advisory {
      background-color: #f29c00;
      font-size: 18px;
    }

    .normal {
      display: block;
      background-color: #28a745;
      font-size: 16px;
    }

    .area-list {
      margin-top: 10px;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.15);
      padding: 10px;
      border-radius: 4px;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>全国 津波情報モニタ</h2>
  <button onclick="checkTsunamiInfo()">最新情報を取得</button>

  <div id="status-display" class="alert-box">
    情報を読み込んでいます...
  </div>

  <script>
    // CORSエラー回避用プロキシ経由で気象庁のデータを取得
    const TARGET_URL = "https://www.jma.go.jp/bosai/tsunami/data/vtse41.json";
    const JMA_TSUNAMI_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(TARGET_URL);

    async function checkTsunamiInfo() {
      const display = document.getElementById("status-display");
      display.style.display = "block";
      display.className = "alert-box";
      display.innerText = "確認中...";

      try {
        const response = await fetch(JMA_TSUNAMI_URL);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        
        const data = await response.json();

        let maxLevel = 0; // 0:なし, 1:注意報, 2:警報, 3:大津波警報
        let affectedAreas = {
          major: [],
          tsunami: [],
          advisory: []
        };

        if (Array.isArray(data)) {
          // 配列形式で返ってくる場合の対応
          for (const entry of data) {
            if (entry.Body && entry.Body.Tsunami && entry.Body.Tsunami.Item) {
              parseTsunamiItems(entry.Body.Tsunami.Item, affectedAreas);
            }
          }
        } else if (data && data.Body && data.Body.Tsunami && data.Body.Tsunami.Item) {
          parseTsunamiItems(data.Body.Tsunami.Item, affectedAreas);
        }

        if (affectedAreas.major.length > 0) maxLevel = 3;
        else if (affectedAreas.tsunami.length > 0) maxLevel = 2;
        else if (affectedAreas.advisory.length > 0) maxLevel = 1;

        if (maxLevel === 3) {
          display.className = "alert-box major-tsunami";
          display.innerHTML = `
            🚨【大津波警報 発令中】<br>
            沿岸部の方は今すぐ高台や頑丈な建物の上層へ逃げてください！<br>
            <div class="area-list">対象地域: ${affectedAreas.major.join("、")}</div>
          `;
        } else if (maxLevel === 2) {
          display.className = "alert-box tsunami";
          display.innerHTML = `
            ⚠️【津波警報 発令中】<br>
            海岸や川の近くにいる方は、今すぐ離れて安全な場所へ逃げてください！<br>
            <div class="area-list">対象地域: ${affectedAreas.tsunami.join("、")}</div>
          `;
        } else if (maxLevel === 1) {
          display.className = "alert-box advisory";
          display.innerHTML = `
            🟡【津波注意報 発令中】<br>
            海の中にいる方はすぐに海から上がり、海岸から離れてください。<br>
            <div class="area-list">対象地域: ${affectedAreas.advisory.join("、")}</div>
          `;
        } else {
          display.className = "alert-box normal";
          display.innerHTML = "現在、日本全国に津波注意報・警報・大津波警報は発表されていません。";
        }

      } catch (error) {
        console.error("データ取得エラー:", error);
        display.style.display = "block";
        display.style.backgroundColor = "#6c757d";
        display.innerText = "情報の取得に失敗しました。ネットワーク接続またはブラウザ設定をご確認ください。";
      }
    }

    function parseTsunamiItems(items, affectedAreas) {
      const itemList = Array.isArray(items) ? items : [items];
      for (const item of itemList) {
        const areaName = item.Area ? item.Area.Name : "";
        const categoryName = item.Category && item.Category.Kind ? item.Category.Kind.Name : "";

        if (categoryName.includes("大津波")) {
          affectedAreas.major.push(areaName);
        } else if (categoryName.includes("警報")) {
          affectedAreas.tsunami.push(areaName);
        } else if (categoryName.includes("注意報")) {
          affectedAreas.advisory.push(areaName);
        }
      }
    }

    checkTsunamiInfo();
  </script>

</body>
</html>
